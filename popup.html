<!DOCTYPE html>
<html lang="pl-PL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        
      #app-popup {
        font-family: Gill Sans, Gill Sans MT, Calibri, Trebuchet MS, sans-serif;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .popup-containner-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: row;
        /* background-color: red; */
        padding-left: 20px;
        padding-right: 20px;
        height: 100%;
      }

      .popup-container {
        background: #fff;
        border-radius: 20px;
        width: calc(100% - 40px); /* margin po 20px */
        max-width: 500px;
        padding: 20px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
        text-align: center;
        position: relative;
      }

      .popup-close {
        position: absolute;
        top: 12px;
        right: 12px;
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        color: #666;
      }

      .popup-body {
        padding: 50px;
      }

      .popup-icon {
        width: 100px;
        height: 100px;
        border-radius: 20px;
        margin-bottom: 15px;
      }

      .popup-title {
        font-size: 20px;
        font-weight: bold;
        margin: 15px 0 15px;
      }

      .popup-text {
        font-size: 16px;
        margin: 0 0 20px;
        color: #444;
        margin-bottom: 40px;
      }

      .popup-buttons {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }

      .popup-button img {
        height: 50px;
      }
    </style>
  </head>
  <body>
    <h1>sample page</h1>

    <!-- Fullscreen Popup -->
    <div id="app-popup" style="display: block">
      <div class="popup-containner-wrapper">
        <div class="popup-container">
          <button class="popup-close">&times;</button>
          <div class="popup-body">
            <img src="quickpercent-logo.png" alt="QuickPercent" class="popup-icon" />
            <h3 class="popup-title">Kalkulator Procentów zawsze z Tobą</h3>
            <p class="popup-text">Pobierz darmową aplikację</p>
            <div class="popup-buttons">
              <a href="https://play.google.com/store/apps/details?id=com.okrajni.quickpercent" target="_blank" rel="noopener noreferrer" class="popup-button google">
                <img src="img/pobierz-google-play-50.png" alt="Google Play" />
              </a>
              <a href="https://apps.apple.com/pl/app/quickpercent-calculator/id6751426770?platform=iphone" target="_blank" rel="noopener noreferrer" class="popup-button apple">
                <img src="img/pobierz-app-store-50.png" alt="App Store" />
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 🔧 Konfiguracja
      const minVisits = 3; // liczba odwiedzin od której ma się pojawić popup
      const hideForDays = 7; // na ile dni schować popup po wyświetleniu

      function isMobile() {
        return /Mobi|Android/i.test(navigator.userAgent);
      }

      function showPopup() {
        document.getElementById("app-popup").style.display = "flex";
      }

      // Obsługa wizyt i popupu
      (function () {
        if (!isMobile()) return; // pokazujemy tylko na mobile

        const now = Date.now();
        const lastShown = localStorage.getItem("popupLastShown");
        const visits = parseInt(localStorage.getItem("popupVisits") || "0") + 1;
        localStorage.setItem("popupVisits", visits);

        if (lastShown && now - parseInt(lastShown) < hideForDays * 24 * 60 * 60 * 1000) {
          return; // popup niedostępny jeszcze
        }

        if (visits >= minVisits) {
          showPopup();
          localStorage.setItem("popupLastShown", now.toString());
          localStorage.setItem("popupVisits", "0");
        }
      })();

      // Zamknięcie popupu
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelector(".popup-close").addEventListener("click", () => {
          document.getElementById("app-popup").style.display = "none";
        });
      });
    </script>
  </body>
</html>
